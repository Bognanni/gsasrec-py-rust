[package]
name = "gsasrec_rust"
version = "0.1.0"
edition = "2021"
default-run = "gsasrec_rust"

[lib]
name = "gsasrec_rust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gsasrec_rust"
path = "src/main.rs"

[[bin]]
name = "infer"
path = "src/infer.rs"

[features]
default = ["cuda", "mkl"]

cuda = ["ort/cuda", "candle-core/cuda", "candle-nn/cuda"]

mkl = ["candle-core/mkl", "candle-nn/mkl"]

[dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls", "copy-dylibs"] }
ndarray = { version = "0.17.2", features = ["std"] }

candle-core = { version = "0.8.2" }
candle-nn   = { version = "0.8.2" }

num_cpus = "1.16.0"
actix-web = "4.4"
env_logger = "0.11"
log = "0.4"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand       = "0.8"
pyo3       = { version = "0.22", features = ["extension-module"] }