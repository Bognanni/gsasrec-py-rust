[package]
name = "gsasrec-rust"
version = "0.1.0"
edition = "2024"
default-run = "gsasrec-rust"

[lib]
name = "rust_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gsasrec-rust"
path = "src/main.rs"

[dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = ["ndarray", "std"] }
ndarray = { version = "0.15", features = ["std"] }
candle-core = { version = "0.8.2", features = ["cuda"] }
candle-nn = { version = "0.8.2", features = ["cuda"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
pyo3 = { version = "0.22", features = ["extension-module"] }